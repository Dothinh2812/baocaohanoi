{% extends "base.html" %}

{% block title %}{{ feature_title }} - Đang chuyển đổi{% endblock %}

{% block content %}
<section class="content-section">
    <div class="card">
        <div class="card-header">
            <h2>{{ feature_title }}</h2>
        </div>
        <div class="card-body" style="padding: 32px;">
            <div class="empty-table" style="padding: 40px 24px;">
                <i class="fas fa-database"></i>
                <p style="font-size: 1.1rem; margin-top: 12px;">Màn này chưa được bật trên nguồn DB mới của dashv4.</p>
                <p style="max-width: 760px; margin: 12px auto 0; color: #666;">{{ feature_reason }}</p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
